# dsh-self-restart 的 bundle 补丁（2026-10-12 起走标准安装方式）
#
# 插件包被登记进 profile 的 dsh.profile.bundles 后，由这份 patch 负责挂载。
# 配置不写在这里：所有默认值都在 lib/index.js 的 Config schema 里
# （enabled/port/idleSeconds/maxWaitMinutes/confirmSeconds/wakeMessage/wakeDelaySeconds/…），
# 用户要改就在自己 profile 的 cordis.patch.yml 里覆盖同名 id 的 config。
- insert:
    - id: self-restart
      name: 'dsh-self-restart'
